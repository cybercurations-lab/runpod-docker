name: Build RunPod Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (e.g., wan22-comfyui:v1)'
        required: true
        default: 'wan22-comfyui:v1'
      model:
        description: 'Model to build'
        required: true
        type: choice
        options:
          - wan22-comfyui
          - wan-gp
          - base
          - wan-a14b
          - hunyuan
          - ltx23

env:
  DOCKERHUB_REPO: cyber2000

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== Freeing GitHub Actions disk space ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
          echo "=== After cleanup ==="
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Select Dockerfile
        run: |
          if [ "${{ inputs.model }}" = "wan-gp" ]; then
            echo "DOCKERFILE=./Dockerfile.wangp" >> $GITHUB_ENV
          else
            echo "DOCKERFILE=./Dockerfile" >> $GITHUB_ENV
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKERHUB_REPO }}/${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          build-args: |
            MODEL=${{ inputs.model }}
